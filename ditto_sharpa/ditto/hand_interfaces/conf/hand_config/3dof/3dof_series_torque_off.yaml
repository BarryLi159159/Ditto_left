# @package hand_config

control_frequency: 250

leader:
  mode: torque_off
  motor_ids: [121, 122, 123] #121, 122, 123]
  general_settings: {}

follower:
  mode: position
  motor_ids: [21, 22, 23]
  offsets: {21: 0, 22: 0, 23: 0}
  general_settings:
    velocity_limit: 200
    p_gain: 1000
    i_gain: 0
    d_gain: 60
  joint_settings:
  - motor_id: 21
    joint_settings:
      motor_model: XM430
      zero_position: 2048
      min_angle_deg: -15
      max_angle_deg: 15
      # direction: 1
  - motor_id: 22
    joint_settings:
      motor_model: XM430
      zero_position: 2048
      min_angle_deg: 0
      max_angle_deg: 90
      # direction: 1
  - motor_id: 23
    joint_settings:
      motor_model: XC330
      zero_position: 2048
      min_angle_deg: 0
      max_angle_deg: 90
      # direction: 1
  

