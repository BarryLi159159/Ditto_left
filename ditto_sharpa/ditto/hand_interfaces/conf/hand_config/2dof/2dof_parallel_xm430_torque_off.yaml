# @package hand_config

control_frequency: 200

leader:
  mode: "torque_off"
  motor_ids: [11, 21]
  general_settings: 
  - motor_id: 11

follower:
  mode: "position"
  motor_ids: [111,121]
  offsets: {111: 0, 121: 0}
  general_settings:
    velocity_limit: 200
    p_gain: 1000
    i_gain: 0
    d_gain: 60
  joint_settings:
  - motor_id: 111
    joint_settings:
      zero_position: 2048
      motor_model: XM430
      min_angle_deg: -45
      max_angle_deg: 70
  - motor_id: 121
    joint_settings:
      zero_position: 2048
      motor_model: XM430
      min_angle_deg: -70
      max_angle_deg: 45