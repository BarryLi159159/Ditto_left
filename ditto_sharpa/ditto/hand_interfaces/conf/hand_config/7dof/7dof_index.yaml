# @package hand_config

control_frequency: 200

leader:
  mode: current
  motor_ids: [121, 122, 123]
  general_settings:
    current_limit: 1500
    current_command: 0
  joint_settings:
  - motor_id: 121
    current_control:
      enable_force_rendering: true
      force_rendering_gain: 0.2
      force_rendering_alpha: 0.8
      force_rendering_threshold: 0.0 # 50.0
      force_rendering_max_current: 200
    joint_settings:
      motor_model: XC330
  - motor_id: 122
    current_control:
      enable_force_rendering: true
      force_rendering_gain: 0.3
      force_rendering_alpha: 0.8
      force_rendering_threshold: 0.0
      force_rendering_max_current: 200
    joint_settings:
      motor_model: XC330
  - motor_id: 123
    current_control:
      enable_force_rendering: true
      force_rendering_gain: 0.3
      force_rendering_alpha: 0.8
      force_rendering_threshold: 0.0
      force_rendering_max_current: 100
    joint_settings:
      motor_model: XC330  
  
follower:
  mode: position
  motor_ids: [21, 22, 23]
  offsets: {21: 0, 22: 0, 23: 0}
  general_settings:
    velocity_limit: 200
    p_gain: 1000
    i_gain: 0
    d_gain: 60
  joint_settings:
  - motor_id: 21
    joint_settings:
      motor_model: XM430
      zero_position: 2048
      min_angle_deg: -25
      max_angle_deg: 30
      # direction: 1
    motor_settings:
      p_gain: 500
      i_gain: 0
      d_gain: 30
  - motor_id: 22
    joint_settings:
      motor_model: XM430
      zero_position: 2048
      min_angle_deg: -25
      max_angle_deg: 90
      # direction: 1
  - motor_id: 23
    joint_settings:
      motor_model: XC330
      zero_position: 2048
      min_angle_deg: -10
      max_angle_deg: 90
      # direction: 1
  

